<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // GitHub Pages 404 redirect handler for custom domain SPA routing
    var path = window.location.pathname;
    if (path.indexOf('internship') !== -1) {
      window.location.replace('/#internships');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="background:#040914;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Redirecting to LR AgroSense...</p>
</body>
</html>
