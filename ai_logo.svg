<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Outer Circle -->
  <circle cx="100" cy="100" r="85" fill="#060d1e" stroke="url(#ai-grad)" stroke-width="6" filter="url(#glow)" />
  <circle cx="100" cy="100" r="75" fill="#0b172a" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 4" />

  <!-- AI Brain / Microchip Circuit Nodes -->
  <path d="M 60 100 H 140 M 100 60 V 140" stroke="#06b6d4" stroke-width="2" opacity="0.4" />
  <circle cx="60" cy="100" r="4" fill="#06b6d4" />
  <circle cx="140" cy="100" r="4" fill="#06b6d4" />
  <circle cx="100" cy="60" r="4" fill="#06b6d4" />
  <circle cx="100" cy="140" r="4" fill="#06b6d4" />

  <!-- Agritech Leaf Central Icon -->
  <path d="M 100 45 C 135 65 140 115 100 150 C 60 115 65 65 100 45 Z" fill="url(#ai-grad)" />
  <path d="M 100 55 V 140 M 100 80 L 125 65 M 100 105 L 130 90 M 100 90 L 75 75 M 100 115 L 70 100" stroke="#060d1e" stroke-width="3.5" stroke-linecap="round" />

  <!-- AI Sparkles Top Right & Left -->
  <polygon points="150,50 155,60 165,65 155,70 150,80 145,70 135,65 145,60" fill="#4ade80" />
  <polygon points="45,130 48,136 54,139 48,142 45,148 42,142 36,139 42,136" fill="#06b6d4" />
</svg>
